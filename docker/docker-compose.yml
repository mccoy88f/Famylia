# Stack completo Famylia — deploy con Portainer
# Nessuna variabile richiesta: l'app rileva l'IP del server automaticamente a runtime.
# Usa: docker compose up -d  oppure incolla in Portainer > Stacks

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: famylia
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_famylia_db}
      POSTGRES_DB: famylia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famylia -d famylia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    environment:
      runmode: development
      role: monolith
      logging: normal
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_REDIS_HOST: redis
      SERVERPOD_REDIS_PORT: "6379"
      SERVERPOD_REDIS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    restart: unless-stopped
    ports:
      - "8083:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
